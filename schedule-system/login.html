<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <style>
        .ht{
            text-align: center;
        }

        .tab{
            margin: 0 auto;
            border-collapse: collapse;
        }
        .tab td{
            border: 1px solid black;
        }

        .tab .buttonContainer{
            text-align: center;
        }

        .tab td:first-child{
            width: 100px;
        }

        .tab td:nth-child(2){
            width: 300px;
        }

        .btn1{
            width: 50px;
            height: 30px;
        }

        #usernameMsg{
            color: black;
        }

    </style>

    <script>
        function checkUsername(){
            // 正则表达式
            var usernameReg = /^[a-zA-z0-9]{5,10}$/
            // 获取用户输入的信息
            var usernameInput = document.getElementById("usernameInput")
            var username = usernameInput.value
            var usernameMsg =  document.getElementById("usernameMsg")
            // 格式有误，返回false，在页面上提示
            if (!usernameReg.test(username)){
                usernameMsg.innerText = "用户名格式有误"
                return false
            }
            usernameMsg.innerText = "OK"
            return true
        }

        function checkUserPwd(){
            // 正则表达式
            var userPwdReg = /^[0-9]{6,16}$/
            // 获取用户输入的信息
            var userPwdInput = document.getElementById("userPwdInput")
            var userPwd = userPwdInput.value
            var userPwdMsg =  document.getElementById("userPwdMsg")
            // 格式有误，返回false，在页面上提示
            if (!userPwdReg.test(userPwd)){
                userPwdMsg.innerText = "密码格式有误"
                return false
            }
            userPwdMsg.innerText = "OK"
            return true
        }

        // 表单提交时校验用户名和密码
        function checkForm(){
            var flag1 = checkUsername()
            var flag2 = checkUserPwd()
            return flag1 && flag2
        }
    </script>
</head>

<body>
    <h1 class="ht">欢迎使用日程管理系统</h1>
    <h3 class="ht">请登录</h3>
    <form method="post" action="/user/login" onsubmit="return checkForm()">
        <table class="tab" cellspacing="0px">
            <tr class="ltr">
                <td>请输入账号</td>
                <td>
                    <input class="ipt" type="text" id="usernameInput" name="username" onblur="checkUsername()">
                    <span id="usernameMsg"></span>
                </td>
            </tr>
            <tr class="ltr">
                <td>请输入密码</td>
                <td>
                    <input class="ipt" type="password" id="userPwdInput" name="userPwd" onblur="checkUserPwd()">
                    <span id="userPwdMsg"></span>
                </td>
            </tr>
            <tr class="ltr">
                <td class="buttonContainer" colspan="2" >
                    <input class="btn1" type="submit" value="登录">
                    <input class="btn1" type="reset" value="重置">
                    <!-- 如果把下面修改成type=button的形式，那么就可以避免在跳转之前再走一次onsubmit -->
                    <button class="btn1" type="button" onclick="location.href='/schedule-system/regist.html'">去注册</button>
                </td>
            </tr>   
        </table>
    </form>
</body>
</html>
